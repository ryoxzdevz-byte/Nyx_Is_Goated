name: Build & Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer (NSIS)
        run: pnpm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: https://api.tryliner.fun
          VITE_COVERS_PROXY_URL: https://covers.tryliner.fun

      # the drag-to-top snap preview (windows 11) is a native add-on built by
      # electron:build:win (native:build); never ship an installer without it
      - name: Verify native snap preview add-on is packaged
        shell: pwsh
        run: |
          $addon = "release/win-unpacked/resources/app.asar.unpacked/native/snap-preview/build/Release/snap_preview.node"
          if (-not (Test-Path $addon)) { throw "snap_preview.node missing from the package: $addon" }
          Write-Host "ok: $addon ($((Get-Item $addon).Length) bytes)"
          # it must also load and export everything the app calls (not just exist)
          node scripts/verify-native-addon.cjs $addon

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write checksums
        run: |
          cd artifacts
          sha256sum */*.exe 2>/dev/null | sed 's#  [^/]*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
